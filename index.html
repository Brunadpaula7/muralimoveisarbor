        /* ── RESET & BASE ── */
        *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; outline: none; }

        :root {
            --bg:           #ffffff;
            --verde-arbor:  #204030; /* Verde Arbor oficial */
            --verde-mid:    #3a6b53;
            --areia:        #BC9570; /* Areia Arbor (secundário) */
            --areia-clara:  #d9be9c; /* Areia para textos pequenos sobre o verde */
            --terracota:    #c4642a; /* Terracota (acento sobre o verde) */
            --linha:        rgba(255,255,255,0.18);
            --font-ui:      'Syne', 'EngraversGothic BT Regular', sans-serif;
            --painel-w:     37.5%;
        }

        /* 1rem = 16px em tela 1920×1080; escala com a tela mantendo 16:9 */
        html { font-size: min(calc(100vw / 120), calc(100vh / 67.5)); }

        body {
            background: var(--verde-arbor);
            color: #fff;
            font-family: var(--font-ui);
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }
        button { font-family: inherit; cursor: pointer; }

        /* ── CURSOR CUSTOMIZADO ── */
        #cur-dot  { display:none; position:fixed; width:6px; height:6px; border-radius:50%; background:#fff; mix-blend-mode:difference; pointer-events:none; z-index:9999; transform: translate(-50%,-50%); }
        #cur-ring { display:none; position:fixed; width:40px; height:40px; border-radius:50%; border:1px solid rgba(255,255,255,0.5); mix-blend-mode:difference; pointer-events:none; z-index:9998; transform: translate(-50%,-50%); }

        /* ── MARCA (fixa sobre o painel) ── */
        .brand {
            position: fixed; z-index: 1500;
            top: 4rem; left: 6rem;
            width: 18.75rem; display: block;
        }
        .brand img { width: 100%; height: auto; display: block; }

        /* ── BILLBOARD ── */
        .billboard-container { width: 100vw; height: 100vh; position: relative; overflow: hidden; }

        .slide {
            position: absolute; inset: 0;
            opacity: 0; visibility: hidden;
            transition: opacity 1.2s ease;
        }
        .slide.active { opacity: 1; visibility: visible; z-index: 10; }

        /* Foto: ocupa a área à direita do painel */
        .slide-photo {
            position: absolute; top: 0; bottom: 0; right: 0; left: var(--painel-w);
            overflow: hidden; background: #4a4a42;
        }
        .slide-bg {
            width: 100%; height: 100%; object-fit: cover;
            transform: scale(1.04);
            transition: transform 9s ease-out;
        }
        .slide.active .slide-bg { transform: scale(1); }
        .slide-photo::after {
            content: ''; position: absolute; inset: 0; pointer-events: none;
            background:
                linear-gradient(0deg, rgba(10,20,15,0.55) 0%, rgba(10,20,15,0) 32%),
                linear-gradient(180deg, rgba(10,20,15,0.35) 0%, rgba(10,20,15,0) 22%);
        }

        /* Painel de informação */
        .slide-panel {
            position: absolute; top: 0; bottom: 0; left: 0; width: var(--painel-w);
            padding: 4rem 5.5rem 4rem 6rem;
            display: flex; flex-direction: column;
            background: var(--verde-arbor);
            overflow: hidden;
        }
        .slide-arvore {
            position: absolute; right: -10.5rem; top: -5.5rem;
            width: 35rem; height: 35rem; object-fit: contain;
            opacity: .08; pointer-events: none;
        }
        .panel-top { position: relative; display: flex; justify-content: flex-end; align-items: flex-start; min-height: 6.25rem; }
        .panel-code { display: flex; flex-direction: column; align-items: flex-end; gap: .4rem; padding-top: .5rem; }
        .panel-code .lbl { font-size: .75rem; letter-spacing: .3em; text-transform: uppercase; color: var(--areia-clara); }
        .panel-code .val { font-size: 1.6rem; letter-spacing: .06em; }

        .panel-mid {
            position: relative; flex: 1; min-height: 0;
            display: flex; flex-direction: column; justify-content: center; gap: 1.5rem;
        }
        .prop-location { display: flex; align-items: center; gap: .9rem; }
        .prop-location img { width: 2.1rem; height: 2.1rem; object-fit: contain; }
        .prop-location span { font-size: 1.06rem; letter-spacing: .32em; text-transform: uppercase; color: var(--areia-clara); }

        .prop-title {
            font-size: 3.75rem; font-weight: 500; line-height: 1.06;
            text-wrap: balance;
            display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; line-clamp: 3; overflow: hidden;
        }
        .prop-subtitle { font-size: 1.4rem; line-height: 1.4; color: var(--areia-clara); }

        .prop-price {
            display: flex; flex-direction: column; gap: .6rem;
            margin-top: .5rem; padding-left: 1.4rem;
            border-left: 3px solid var(--terracota);
        }
        .prop-price .lbl { font-size: .8rem; letter-spacing: .34em; text-transform: uppercase; color: var(--areia-clara); }
        .prop-price .val { font-size: 4.5rem; line-height: 1; font-weight: 500; letter-spacing: -0.02em; }

        /* Especificações */
        .panel-specs {
            position: relative; display: flex; flex-direction: column; gap: 1.5rem;
            padding-top: 1.75rem; border-top: 1px solid var(--linha);
        }
        .spec-row { display: flex; gap: 1.4rem; }
        .spec-item { display: flex; flex-direction: column; gap: .75rem; min-width: 0; flex: 1 1 0; }
        .spec-item img { width: 3.5rem; height: 3.5rem; object-fit: contain; object-position: left center; }
        .spec-value { font-size: 1.44rem; line-height: 1; white-space: nowrap; }
        .spec-label { font-size: .69rem; letter-spacing: .2em; text-transform: uppercase; color: var(--areia-clara); }

        .extras { display: flex; flex-wrap: wrap; gap: .9rem 1.75rem; padding-top: 1.4rem; border-top: 1px solid var(--linha); }
        .extra { display: flex; align-items: center; gap: .65rem; }
        .extra img { width: 2.4rem; height: 2.4rem; object-fit: contain; }
        .extra span { font-size: .81rem; letter-spacing: .18em; text-transform: uppercase; }
        .spec-line { font-size: 1.25rem; color: var(--areia-clara); }

        /* entrada animada do painel */
        .slide-panel > * { opacity: 0; transform: translateY(1.2rem); transition: opacity .9s ease, transform .9s ease; }
        .slide.active .slide-panel > * { opacity: 1; transform: none; }
        .slide.active .slide-panel > :nth-child(3) { transition-delay: .25s; }
        .slide.active .slide-panel > :nth-child(4) { transition-delay: .5s; }
        .slide .slide-panel > img.slide-arvore { opacity: .08; transform: none; transition: none; }

        /* ── CONTROLES (sobre a foto) ── */
        .controls {
            position: fixed; z-index: 100;
            left: calc(var(--painel-w) + 4.5rem); right: 4.5rem; bottom: 3.5rem;
            display: flex; align-items: center; gap: 2rem;
        }
        .counter { display: flex; align-items: baseline; gap: .6rem; }
        .counter .cur { font-size: 2.75rem; line-height: 1; }
        .counter .tot { font-size: 1.1rem; color: rgba(255,255,255,.8); }
        .progress-container { flex: 1; height: 2px; background: rgba(255,255,255,.35); position: relative; }
        .progress-bar { position: absolute; left: 0; top: 0; height: 100%; background: #e0b48a; width: 0%; }
        .nav-btn {
            width: 3.5rem; height: 3.5rem; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            color: #fff; background: rgba(20,40,30,.35); border: 1px solid rgba(255,255,255,.6);
            transition: transform .3s ease, background .3s ease;
        }
        .nav-btn.next { background: #fff; color: var(--verde-arbor); border-color: #fff; }
        .nav-btn:hover { transform: scale(1.08); }
        .nav-btn svg { width: 1.4rem; height: 1.4rem; }

        /* ── PLAYER DE MÚSICA ── */
        .music-player {
            position: fixed; z-index: 1500; top: 3.5rem; right: 4.5rem;
            display: flex; align-items: center; gap: 0;
            height: 3.25rem; padding: 0 .5rem; border-radius: 2rem;
            background: rgba(255,255,255,.92); color: var(--verde-arbor);
        }
        .music-panel {
            display: flex; align-items: center; gap: .9rem;
            overflow: hidden; max-width: 0; opacity: 0; white-space: nowrap;
            transition: max-width .6s cubic-bezier(0.16,1,0.3,1), opacity .4s ease;
        }
        .music-panel.open { max-width: 20rem; opacity: 1; padding: 0 .9rem 0 .9rem; }
        .sound-waves { display: flex; align-items: flex-end; gap: 3px; height: 1.1rem; flex-shrink: 0; }
        .sound-waves span { display: block; width: 3px; border-radius: 2px; background: var(--verde-arbor); animation: wave .9s ease-in-out infinite; transform-origin: bottom; }
        .sound-waves span:nth-child(1) { height: 40%;  animation-delay: 0s; }
        .sound-waves span:nth-child(2) { height: 85%;  animation-delay: .15s; }
        .sound-waves span:nth-child(3) { height: 60%;  animation-delay: .3s; }
        .sound-waves span:nth-child(4) { height: 100%; animation-delay: .1s; }
        .sound-waves span:nth-child(5) { height: 50%;  animation-delay: .25s; }
        .sound-waves.paused span { animation-play-state: paused; }
        @keyframes wave { 0%,100% { transform: scaleY(.4); } 50% { transform: scaleY(1); } }
        .station-name { font-size: .8rem; letter-spacing: .24em; text-transform: uppercase; }
        .vol-wrap { display: flex; align-items: center; gap: .4rem; }
        .vol-slider { -webkit-appearance: none; appearance: none; width: 4rem; height: 2px; border-radius: 2px; background: rgba(32,64,48,.25); cursor: pointer; }
        .vol-slider::-webkit-slider-thumb { -webkit-appearance: none; width: .8rem; height: .8rem; border-radius: 50%; background: var(--verde-arbor); }
        .vol-slider::-moz-range-thumb { width: .8rem; height: .8rem; border-radius: 50%; background: var(--verde-arbor); border: none; }
        .music-btn {
            width: 2.5rem; height: 2.5rem; border: 0; border-radius: 50%;
            background: var(--verde-arbor); color: #fff;
            display: flex; align-items: center; justify-content: center; flex-shrink: 0;
        }
        .music-btn svg { width: 1rem; height: 1rem; }

        /* ── LOADER ── */
        #loader {
            position: fixed; inset: 0; background: var(--verde-arbor); z-index: 2000;
            display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 30px;
            transition: opacity .5s ease;
        }
        .loader-text { font-size: .75rem; letter-spacing: .6em; color: var(--areia-clara); text-transform: uppercase; text-align: center; padding: 0 1rem; }
        .loader-bar-wrap { width: 180px; height: 1px; background: rgba(255,255,255,.15); overflow: hidden; }
        .loader-bar-inner { width: 100%; height: 100%; background: var(--areia-clara); animation: load 2.5s infinite linear; }
        @keyframes load { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }

        /* ── CELULAR / RETRATO: foto em cima, painel embaixo ── */
        @media (max-width: 768px), (max-aspect-ratio: 1/1) {
            html { font-size: 16px; }
            :root { --painel-w: 100%; }
            body { overflow: auto; }
            .billboard-container { height: 100vh; height: 100dvh; }
            .slide-photo { left: 0; right: 0; top: 0; bottom: auto; height: 40%; }
            .slide-panel {
                top: 40%; bottom: 0; width: 100%;
                padding: 1.4rem 1.5rem 1.25rem; gap: .5rem;
            }
            .slide-arvore { width: 24rem; height: 24rem; right: -8rem; top: auto; bottom: -5rem; }
            .panel-top { position: absolute; top: 1.4rem; right: 1.5rem; min-height: 0; z-index: 2; }
            .panel-code { flex-direction: row; align-items: baseline; gap: .5rem; padding: 0; }
            .panel-code .lbl { font-size: .7rem; letter-spacing: .16em; }
            .panel-code .val { font-size: .8rem; letter-spacing: .1em; color: var(--areia-clara); }
            .panel-mid { gap: .75rem; justify-content: flex-start; padding-top: 1.9rem; }
            .prop-location img { width: 1.4rem; height: 1.4rem; }
            .prop-location span { font-size: .75rem; letter-spacing: .26em; }
            .prop-title { font-size: 1.65rem; line-height: 1.1; -webkit-line-clamp: 2; line-clamp: 2; }
            .prop-subtitle { font-size: .85rem; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; line-clamp: 2; overflow: hidden; }
            .prop-price { margin-top: .25rem; padding-left: .9rem; gap: .35rem; }
            .prop-price .lbl { font-size: .7rem; }
            .prop-price .val { font-size: 2.1rem; }
            .panel-specs { gap: .6rem; padding-top: .8rem; }
            .spec-row { gap: .4rem; }
            .spec-item { align-items: center; gap: .4rem; }
            .spec-item img { width: 2.1rem; height: 2.1rem; object-position: center; }
            .spec-value { font-size: .78rem; }
            .spec-label { font-size: .6rem; letter-spacing: .12em; }
            .extras { gap: .4rem 1rem; padding-top: .7rem; justify-content: center; }
            .extra img { width: 1.5rem; height: 1.5rem; }
            .extra span { font-size: .62rem; letter-spacing: .12em; }
            .spec-line { font-size: .82rem; text-align: center; }
            .brand { top: 1.1rem; left: 1.5rem; width: 9.5rem; }
            .music-player { top: 1rem; right: 1.5rem; height: 2.75rem; padding: 0 .35rem; }
            .music-panel.open { max-width: 7rem; padding: 0 .6rem; }
            .vol-wrap { display: none; }
            .music-btn { width: 2.1rem; height: 2.1rem; }
            .controls { left: 1.5rem; right: 1.5rem; bottom: auto; top: calc(40% - 3.6rem); gap: .8rem; }
            .counter .cur { font-size: 1.25rem; }
            .counter .tot { font-size: .75rem; }
            .nav-btn { width: 2.75rem; height: 2.75rem; }
            .nav-btn svg { width: 1.1rem; height: 1.1rem; }
        }

        @media (prefers-reduced-motion: reduce) {
            .slide, .slide-bg, .slide-panel > * { transition: none !important; }
        }
    </style>
</head>
<body>

<div id="cur-dot"></div>
<div id="cur-ring"></div>

<div id="loader">
    <div class="loader-text">Portfólio Arbor Imóveis</div>
    <div class="loader-bar-wrap"><div class="loader-bar-inner"></div></div>
</div>

<!-- Áudio: estação de música ambiente; reprodução iniciada pelo usuário -->
<audio id="music" preload="none" crossorigin="anonymous">
    <source id="music-src" src="" type="audio/mpeg">
</audio>

<a href="#" class="brand" aria-label="Arbor Imóveis"><img src="assets/logo-arbor.png" alt="Arbor Imóveis"></a>

<!-- Player de Música -->
<div class="music-player">
    <div class="music-panel" id="music-panel">
        <div class="sound-waves paused" id="waves" aria-hidden="true">
            <span></span><span></span><span></span><span></span><span></span>
        </div>
        <span class="station-name" id="station-name">Ambiente</span>
        <div class="vol-wrap">
            <input type="range" class="vol-slider" id="vol-slider" min="0" max="1" step="0.05" value="0.5" aria-label="Volume" oninput="setVolume(this.value)">
        </div>
    </div>
    <button class="music-btn" id="music-btn" onclick="toggleMusic()" aria-label="Tocar ou pausar a música">
        <svg viewBox="0 0 24 24" fill="currentColor" id="icon-play" aria-hidden="true"><path d="M8 5l11 7-11 7z"/></svg>
        <svg viewBox="0 0 24 24" fill="currentColor" id="icon-pause" style="display:none;" aria-hidden="true">
            <rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/>
        </svg>
    </button>
</div>

<main class="billboard-container" id="billboard"></main>

<div class="controls">
    <div class="counter"><span class="cur" id="counter-cur">01</span><span class="tot" id="counter-tot">/ 00</span></div>
    <div class="progress-container"><div class="progress-bar" id="progress"></div></div>
    <button class="nav-btn" aria-label="Anterior" onclick="prevSlide()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
    </button>
    <button class="nav-btn next" aria-label="Próximo" onclick="nextSlide()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </button>
</div>

<script>
/**
 * ─────────────────────────────────────────────────────────────────────────────
 *  ARBOR IMÓVEIS — Billboard Portfólio
 *  Feed: VRSync (Viva Real / Jetimob) — xmlns VRSync 1.0
 *
 *  Campos mapeados:
 *    ListingID                        → código
 *    Title                            → título
 *    Details > ListPrice/SalePrice     → preço de venda (BRL)
 *    Details > RentalPrice             → preço de aluguel (BRL, exibido com /mês)
 *    Location > Neighborhood          → bairro
 *    Details > ConstructedArea        → área (m²)
 *    Details > LotArea                → terreno (quando informado)
 *    Details > PropertyAdministrationFee → condomínio (BRL)
 *    Details > Bedrooms / Suites / Bathrooms / Garage → quartos, suítes, banheiros, vagas
 *    Features, Title, Description     → piscina, churrasqueira, cinema, mobiliado, nascente
 *    Media > Item[medium=image]       → foto (texto do elemento)
 * ─────────────────────────────────────────────────────────────────────────────
 */
const DATA_URL = "https://arbor-backend.arborimoveis-bruna.workers.dev/feed/vrsync.xml";
const SLIDE_DURATION = 9000;

let state = {
    items: [],
    currentIndex: 0,
    interval: null,
    progressInterval: null,
    startTime: 0
};

/* ── Formatação de moeda ── */
const formatBRL = (v, isRental = false) => (v && v > 0)
    ? new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL', maximumFractionDigits: 0 }).format(v) + (isRental ? '/mês' : '')
    : '';
const formatArea = raw => {
    const n = Number(raw);
    return raw && Number.isFinite(n) && n > 0
        ? `${new Intl.NumberFormat('pt-BR', { maximumFractionDigits: 2 }).format(n)} m²`
        : '';
};
const terrainFromText = text => {
    const number = '([\\d.,]+)';
    const unit = 'm[²2]';
    const patterns = [
        new RegExp(`${number}\\s*${unit}\\s*(?:de\\s*)?(?:área\\s*de\\s*)?(?:terreno|lote)\\b`, 'i'),
        new RegExp(`\\b(?:terreno|lote)\\s*(?:amplo\\s*)?(?:com\\s*)?(?:de\\s*)?${number}\\s*${unit}`, 'i')
    ];
    for (const pattern of patterns) {
        const match = text.match(pattern);
        if (!match) continue;
        const raw = match[1].includes(',') ? match[1].replace(/\\./g, '').replace(',', '.') : match[1];
        const area = formatArea(raw);
        if (area) return area;
    }
    return '';
};

/* ── Protege conteúdo vindo do feed ao inserir no HTML ── */
const escapeHTML = value => String(value).replace(/[&<>"']/g, char => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
}[char]));

/* ── Sanitiza URL de foto ── */
const sanitizePhotoUrl = url => {
    if (!url) return '';
    try {
        const parsed = new URL(String(url).trim());
        return ['http:', 'https:'].includes(parsed.protocol) ? parsed.href : '';
    } catch { return ''; }
};

/* ── Busca tags VRSync pelo nome local, sem modificar o XML original ── */
const xmlNodes = (node, tag) => [...node.getElementsByTagName('*')]
    .filter(el => el.localName.toLowerCase() === tag.toLowerCase());
const xmlGet = (node, tag) => xmlNodes(node, tag)[0]?.textContent.trim() || '';
const xmlDetail = (listing, tag) => {
    const details = xmlNodes(listing, 'Details')[0];
    return details ? xmlGet(details, tag) : '';
};

/* ── Diferenciais detectados em Features, título e descrição ── */
const detectAmenities = (listing, title) => {
    const text = [
        ...xmlNodes(listing, 'Feature').map(el => el.textContent),
        title,
        xmlDetail(listing, 'Description')
    ].join(' ').toLowerCase();
    return {
        pool:     /piscina|\bpool\b/.test(text),
        bbq:      /churrasqueira|barbecue|\bbbq\b/.test(text),
        cinema:   /home\s*cinema|home\s*theater|sala de cinema|\bcinema\b/.test(text),
        furnished: /(?<!n[ãa]o )(?<!semi[ -])(?<!semi)mobiliad|\bfurnished\b/.test(text) && !/semi[ -]?mobiliad|semi[ -]?furnished/.test(text),
        sunrise:  /nascente/.test(text)
    };
};

/* ── Busca e analisa o feed VRSync (Viva Real / Jetimob) ── */
const fetchFeed = async () => {
    const res  = await fetch(DATA_URL, { cache: 'no-store' });
    if (!res.ok) throw new Error(`Feed XML indisponível (HTTP ${res.status})`);
    const text = await res.text();

    const parser   = new DOMParser();
    const xml      = parser.parseFromString(text, 'application/xml');

    const parseErr = xml.getElementsByTagName('parsererror')[0];
    if (parseErr) throw new Error('XML inválido: ' + parseErr.textContent.slice(0, 120));

    const listings = xmlNodes(xml, 'Listing');
    if (!listings.length) throw new Error('Feed XML sem imóveis');

    return listings.map(l => {

        /* ── Foto principal ──
           No VRSync a URL é o texto direto do <Item medium="image">
           Prefere primary="true"; fallback para o primeiro image qualquer */
        let photoUrl = '';
        const items = xmlNodes(l, 'Item');
        let fallbackPhoto = '';
        for (const item of items) {
            const medium  = (item.getAttribute('medium') || '').toLowerCase();
            const primary = item.getAttribute('primary');
            if (medium === 'image') {
                const url = sanitizePhotoUrl(item.textContent);
                if (!fallbackPhoto && url) fallbackPhoto = url;
                if (primary?.toLowerCase() === 'true' && url) { photoUrl = url; break; }
            }
        }
        if (!photoUrl) photoUrl = fallbackPhoto;

        /* ── Área: ConstructedArea → LivingArea ── */
        const area = xmlDetail(l, 'ConstructedArea') || xmlDetail(l, 'LivingArea');
        const title = xmlGet(l, 'Title');
        const propertyType = xmlDetail(l, 'PropertyType');
        const supportsTerrain = /\b(casa|sobrado|prédio|predio|loja|galp[aã]o|barrac[aã]o|edifício|edificio)\b/i.test(title)
            || /\/ Home\b/i.test(propertyType)
            || /Commercial\s*\/\s*(Building|Retail|Warehouse)\b/i.test(propertyType);
        const lot = supportsTerrain
            ? (formatArea(xmlDetail(l, 'LotArea')) || terrainFromText(title) || terrainFromText(xmlDetail(l, 'Description')))
            : '';
        const condoFee = Number(xmlDetail(l, 'PropertyAdministrationFee')) || 0;

        /* ── Preço dentro de <Details>: venda (ListPrice/SalePrice) ou aluguel (RentalPrice) ── */
        const rentalRaw = xmlDetail(l, 'RentalPrice');
        const saleRaw   = xmlDetail(l, 'ListPrice') || xmlDetail(l, 'SalePrice');
        const priceRaw  = saleRaw || rentalRaw;
        const transaction = xmlGet(l, 'TransactionType').toLowerCase();
        const isRental  = transaction === 'for rent' || (!transaction && !saleRaw && !!rentalRaw);

        /* ── Bairro ── */
        const hood = xmlGet(l, 'Neighborhood');

        return {
            id:     xmlGet(l, 'ListingID'),
            title,
            displayTitle: title.split('|')[0].trim() || title,
            subtitle: title.split('|').slice(1, 3).map(part => part.trim()).filter(Boolean).join(' · '),
            price:  Number(isRental ? rentalRaw : saleRaw) || 0,
            isRental,
            hood,
            area:   formatArea(area),
            lot,
            condoFee,
            beds:   Number(xmlDetail(l, 'Bedrooms')) || 0,
            suites: Number(xmlDetail(l, 'Suites')) || 0,
            baths:  Number(xmlDetail(l, 'Bathrooms')) || 0,
            garage: Number(xmlDetail(l, 'Garage')) || 0,
            amenities: detectAmenities(l, title),
            photo:  photoUrl
        };
    }).filter(p => p.id && p.title && p.photo);
};

/* ── Renderiza slides ── */
const specItem = (icon, label, value) => `
    <div class="spec-item">
        <img src="assets/icons/${icon}.png" alt="" aria-hidden="true">
        <span class="spec-value">${escapeHTML(value)}</span>
        <span class="spec-label">${escapeHTML(label)}</span>
    </div>`;
const extraItem = (icon, label) => `
    <div class="extra">
        <img src="assets/icons/${icon}.png" alt="" aria-hidden="true">
        <span>${escapeHTML(label)}</span>
    </div>`;

const renderSlide = (p, idx) => {
    const a = p.amenities;

    const specs = [
        p.area      ? specItem('area', 'Área', p.area) : '',
        p.lot       ? specItem('terreno', 'Terreno', p.lot) : '',
        a.pool      ? specItem('piscina', 'Piscina', 'Sim') : '',
        p.baths > 0 ? specItem('banheiros', 'Banheiros', String(p.baths)) : '',
        a.bbq       ? specItem('churrasqueira', 'Churrasq.', 'Sim') : ''
    ].join('');

    const extras = [
        a.cinema    ? extraItem('cinema', 'Cinema') : '',
        a.furnished ? extraItem('mobiliado', 'Mobiliado') : '',
        a.sunrise   ? extraItem('nascente', 'Nascente') : ''
    ].join('');

    const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;
    const line = [
        p.beds   > 0 ? plural(p.beds, 'quarto', 'quartos') : '',
        p.suites > 0 ? plural(p.suites, 'suíte', 'suítes') : '',
        p.garage > 0 ? plural(p.garage, 'vaga', 'vagas') : '',
        p.condoFee > 0 ? `Condomínio ${formatBRL(p.condoFee)}/mês` : ''
    ].filter(Boolean).join(' · ');

    return `
        <div class="slide ${idx === 0 ? 'active' : ''}" id="slide-${idx}">
            <div class="slide-photo">
                <img src="${escapeHTML(p.photo)}"
                     class="slide-bg"
                     alt="${escapeHTML(p.title)}"
                     loading="${idx < 2 ? 'eager' : 'lazy'}"
                     onerror="this.onerror=null;this.style.visibility='hidden';">
            </div>

            <div class="slide-panel">
                <img class="slide-arvore" src="assets/arvore.png" alt="" aria-hidden="true">

                <div class="panel-top">
                    <div class="panel-code">
                        <span class="lbl">Código</span>
                        <span class="val">${escapeHTML(p.id)}</span>
                    </div>
                </div>

                <div class="panel-mid">
                    ${p.hood ? `<div class="prop-location">
                        <img src="assets/icons/localizacao.png" alt="" aria-hidden="true">
                        <span>${escapeHTML(p.hood)}</span>
                    </div>` : ''}
                    <h1 class="prop-title" title="${escapeHTML(p.title)}">${escapeHTML(p.displayTitle)}</h1>
                    ${p.subtitle ? `<div class="prop-subtitle">${escapeHTML(p.subtitle)}</div>` : ''}
                    ${p.price > 0 ? `<div class="prop-price">
                        <span class="lbl">${p.isRental ? 'Aluguel' : 'Venda'}</span>
                        <span class="val">${escapeHTML(formatBRL(p.price, p.isRental))}</span>
                    </div>` : ''}
                </div>

                <div class="panel-specs">
                    ${specs ? `<div class="spec-row">${specs}</div>` : ''}
                    ${extras ? `<div class="extras">${extras}</div>` : ''}
                    ${line ? `<div class="spec-line">${escapeHTML(line)}</div>` : ''}
                </div>
            </div>
        </div>`;
};

const renderSlides = () => {
    const container = document.getElementById('billboard');

    if (!state.items.length) {
        container.innerHTML = `
            <div style="display:flex;align-items:center;justify-content:center;height:100%;
                        flex-direction:column;gap:20px;color:#d9be9c;text-align:center;padding:0 24px;">
                <span style="font-size:.75rem;letter-spacing:.3em;text-transform:uppercase;">
                    Nenhum ativo disponível
                </span>
                <span style="font-size:.6rem;color:rgba(255,255,255,0.5);">
                    Verifique se os imóveis do XML possuem código, título e fotos
                </span>
            </div>`;
        return;
    }

    container.innerHTML = state.items.map(renderSlide).join('');
    document.getElementById('counter-tot').textContent = '/ ' + String(state.items.length).padStart(2, '0');
};

/* ── Navegação ── */
const goToSlide = index => {
    const slides = document.querySelectorAll('.slide');
    if (!slides.length) return;
    slides[state.currentIndex].classList.remove('active');
    state.currentIndex = ((index % state.items.length) + state.items.length) % state.items.length;
    slides[state.currentIndex].classList.add('active');
    document.getElementById('counter-cur').textContent = String(state.currentIndex + 1).padStart(2, '0');
    resetProgress();
};

const nextSlide = () => goToSlide(state.currentIndex + 1);
const prevSlide = () => goToSlide(state.currentIndex - 1);

/* ── Ciclo automático + barra de progresso ── */
const startAutoCycle = () => {
    state.startTime = Date.now();
    state.interval = setInterval(nextSlide, SLIDE_DURATION);
    state.progressInterval = setInterval(() => {
        const elapsed = Date.now() - state.startTime;
        const pct = Math.min((elapsed / SLIDE_DURATION) * 100, 100);
        const bar = document.getElementById('progress');
        if (bar) bar.style.width = pct + '%';
    }, 50);
};

const resetProgress = () => {
    clearInterval(state.interval);
    clearInterval(state.progressInterval);
    const bar = document.getElementById('progress');
    if (bar) bar.style.width = '0%';
    startAutoCycle();
};

/* ── Init ── */
const init = async () => {
    try {
        state.items = await fetchFeed();
        renderSlides();
        startAutoCycle();
    } catch (err) {
        console.error('Erro ao carregar feed Arbor:', err);
        const loader = document.getElementById('loader');
        loader.querySelector('.loader-text').textContent = 'Falha ao conectar ao feed XML.';
        loader.querySelector('.loader-bar-wrap').style.display = 'none';
        return; // mantém o loader visível como tela de erro
    }

    const loader = document.getElementById('loader');
    loader.style.opacity = '0';
    setTimeout(() => loader.style.display = 'none', 500);
};

/* ── Player de música ambiente (SomaFM · Drone Zone) ── */
const AMBIENT_STREAM = 'https://ice5.somafm.com/dronezone-128-mp3';

let musicPlaying = false;

const audio = document.getElementById('music');
const musicSrc = document.getElementById('music-src');
const waves = document.getElementById('waves');
const panel = document.getElementById('music-panel');
const iconPlay = document.getElementById('icon-play');
const iconPause = document.getElementById('icon-pause');

// Volume inicial
audio.volume = 0.5;

const setVolume = v => { audio.volume = parseFloat(v); };

const toggleMusic = () => {
    if (!musicPlaying) {
        // Primeira vez: carrega a estação padrão
        if (!musicSrc.src || musicSrc.src === window.location.href) {
            musicSrc.src = AMBIENT_STREAM;
            audio.load();
        }
        audio.play()
            .then(() => {
                musicPlaying = true;
                waves.classList.remove('paused');
                iconPlay.style.display  = 'none';
                iconPause.style.display = 'block';
                panel.classList.add('open');
            })
            .catch(err => {
                console.warn('Autoplay bloqueado:', err);
            });
    } else {
        audio.pause();
        musicPlaying = false;
        waves.classList.add('paused');
        iconPlay.style.display  = 'block';
        iconPause.style.display = 'none';
    }
};

// Reconecta stream se cair
audio.addEventListener('error', () => {
    if (musicPlaying) {
        setTimeout(() => { audio.load(); audio.play().catch(() => {}); }, 3000);
    }
});
audio.addEventListener('ended', () => {
    if (musicPlaying) { audio.load(); audio.play().catch(() => {}); }
});

/* ── Cursor cinemático ── */
let mx = 0, my = 0, rx = 0, ry = 0;
document.addEventListener('mousemove', e => {
    mx = e.clientX; my = e.clientY;
    const dot = document.getElementById('cur-dot');
    if (dot) { dot.style.display = 'block'; dot.style.left = mx + 'px'; dot.style.top = my + 'px'; }
});
(function animRing() {
    rx += (mx - rx) * 0.12;
    ry += (my - ry) * 0.12;
    const ring = document.getElementById('cur-ring');
    if (ring) { ring.style.display = mx || my ? 'block' : 'none'; ring.style.left = rx + 'px'; ring.style.top = ry + 'px'; }
    requestAnimationFrame(animRing);
})();

window.addEventListener('DOMContentLoaded', init);
</script>

</body>
</html>
